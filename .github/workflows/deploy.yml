name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /next-hurai
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Branch publishing starts GitHub's own Pages workflow on every push.
      # Wait for it so its raw-source deployment cannot replace the Next.js site.
      - name: Wait for branch Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (let attempt = 0; attempt < 60; attempt++) {
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
              if (branch.data.commit.sha !== context.sha) {
                core.setFailed("A newer main commit exists; skipping this deployment.");
                return;
              }
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: context.sha, per_page: 100
              });
              const branchRun = runs.data.workflow_runs.find(run =>
                run.path === "dynamic/pages/pages-build-deployment"
              );
              if (branchRun && branchRun.status === "completed") return;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed("Timed out waiting for GitHub's branch Pages deployment.");
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
